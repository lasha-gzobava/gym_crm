# ----- common defaults -----
spring.application.name=gym-crm
spring.jpa.open-in-view=false

# Actuator/metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# JWT settings
jwt.secret=e2b46d0f7c3a95ab5f9c6e2a47b1d0c98f47e9c5b1a26d38c4f9d12c0e7a54fb
jwt.expiration=3600000

# Eureka server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# --- Feign uses Spring Cloud CircuitBreaker (backed by Resilience4j) ---
feign.circuitbreaker.enabled=true

# --- Resilience4j circuit breaker tuning for the name "trainerService" ---
resilience4j.circuitbreaker.instances.trainerService.register-health-indicator=true
resilience4j.circuitbreaker.instances.trainerService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.trainerService.sliding-window-size=10
resilience4j.circuitbreaker.instances.trainerService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.trainerService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.trainerService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.trainerService.wait-duration-in-open-state=10s


# --- Resilience4j circuit breaker for workloadService ---
resilience4j.circuitbreaker.instances.workloadService.register-health-indicator=true
resilience4j.circuitbreaker.instances.workloadService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.workloadService.sliding-window-size=10
resilience4j.circuitbreaker.instances.workloadService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.workloadService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.workloadService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.workloadService.wait-duration-in-open-state=10s

# ----- Logging Pattern to include trace IDs -----

# Disable Zipkin exporting
management.tracing.enabled=true
management.zipkin.tracing.export.enabled=false

